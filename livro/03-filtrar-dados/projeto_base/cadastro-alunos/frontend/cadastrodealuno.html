<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Aluno</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/frontend/css/estilo.css"
    >

</head>

<body>

    <nav class="navbar navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                Gestão Escolar
            </a>

            <a
                href="/frontend/alunos.html"
                class="btn btn-light btn-sm"
            >
                Ver alunos
            </a>

        </div>

    </nav>


    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow border-0">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="fw-bold mb-1">
                            Cadastro de Aluno
                        </h1>

                        <p class="text-muted mb-4">
                            Preencha os dados do aluno.
                        </p>


                        <div
                            id="mensagem"
                            class="mb-3"
                        ></div>


                        <form id="form-aluno">

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label
                                        for="nome"
                                        class="form-label"
                                    >
                                        Nome
                                    </label>

                                    <input
                                        type="text"
                                        id="nome"
                                        class="form-control"
                                        required
                                    >

                                </div>


                                <div class="col-md-6">

                                    <label
                                        for="cpf"
                                        class="form-label"
                                    >
                                        CPF
                                    </label>

                                    <input
                                        type="text"
                                        id="cpf"
                                        class="form-control"
                                        required
                                    >

                                </div>


                                <div class="col-md-6">

                                    <label
                                        for="email"
                                        class="form-label"
                                    >
                                        E-mail
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        required
                                    >

                                </div>


                                <div class="col-md-6">

                                    <label
                                        for="data_nascimento"
                                        class="form-label"
                                    >
                                        Data de nascimento
                                    </label>

                                    <input
                                        type="date"
                                        id="data_nascimento"
                                        class="form-control"
                                        required
                                    >

                                </div>


                                <div class="col-md-6">

                                    <label
                                        for="telefone"
                                        class="form-label"
                                    >
                                        Telefone
                                    </label>

                                    <input
                                        type="text"
                                        id="telefone"
                                        class="form-control"
                                        required
                                    >

                                </div>


                                <div class="col-md-6">

                                    <label
                                        for="ra"
                                        class="form-label"
                                    >
                                        RA
                                    </label>

                                    <input
                                        type="text"
                                        id="ra"
                                        class="form-control"
                                        required
                                    >

                                </div>


                                <div class="col-12">

                                    <label
                                        for="cidade"
                                        class="form-label"
                                    >
                                        Cidade
                                    </label>

                                    <input
                                        type="text"
                                        id="cidade"
                                        class="form-control"
                                        required
                                    >

                                </div>

                            </div>


                            <div class="d-flex gap-2 mt-4">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Cadastrar aluno
                                </button>

                                <a
                                    href="/"
                                    class="btn btn-outline-secondary"
                                >
                                    Cancelar
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="/frontend/js/aluno.js"></script>

</body>

</html>
